name: Cart-ci Pipeline

on:
  push:
    
    branches: [ "main", "CI-Workflows" ] 
    paths:
      - 'catlogue/**'
      - '.github/workflows/catalogue-ci.yml'
  
  pull_request:
    branches: [ "main" ]
    paths:
      - 'catalogue/**'


jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/robot-shop-catalogue

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} ./catalogue


      # # Run Trivy Scan
      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: 'my-dockerhub-username/robot-shop-payment:${{ github.sha }}'
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Docker Hub
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}